name: _step.build

on:
  workflow_call:
    inputs:
      target_subproject:
        description: see release.yml, leave it empty to build all
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build with gradle
        run: |
          chmod +x gradlew
          if [ -z "${{ inputs.target_subproject }}" ]; then
              echo "Building all subprojects"
              ./gradlew buildAndGather --stacktrace
          else
              args=$(echo "${{ inputs.target_subproject }}" | tr ',' '\n' | sed 's/$/:build/' | paste -sd ' ')
              echo "Building with arguments=$args"
              ./gradlew $args --stacktrace
          fi

      - name: Upload per-version artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: versions/*/build/libs/

      - name: Collect mod jars into mods/
        run: |
          shopt -s extglob
          mkdir -p mods
          for jar in versions/*/build/libs/!(*-@(dev|sources|shadow)).jar; do
              cp -p "$jar" mods/
          done
          ls -l mods

      - name: Upload mods
        uses: actions/upload-artifact@v7
        with:
          name: mods
          path: mods/*.jar