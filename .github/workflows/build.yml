name: _step.build

on:
  workflow_call:
    inputs:
      target_subproject:
        description: see release.yml, leave it empty to build all
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 的增强缓存依赖本地服务；分支构建下该服务不可达（Connection refused），会让 ./gradlew 直接失败，先关闭缓存
          cache-disabled: true

      - name: Build with gradle
        run: |
          chmod +x gradlew
          if [ -z "${{ inputs.target_subproject }}" ]; then
              echo "Building all subprojects"
              args="buildAndGather"
          else
              args=$(echo "${{ inputs.target_subproject }}" | tr ',' '\n' | sed 's/$/:build/' | paste -sd ' ')
              echo "Building with arguments=$args"
          fi
          set +e
          out=$(./gradlew $args --stacktrace 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ]; then
              escaped=$(printf '%s' "$out" | tail -c 1200 | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=GradleFailed::$escaped"
              exit $code
          fi

      - name: Upload per-version artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: versions/*/build/libs/

      # All mod jars gathered into a single "mods" folder
      - name: Collect mod jars into mods/
        run: |
          shopt -s extglob
          mkdir -p mods
          for jar in versions/*/build/libs/!(*-@(dev|sources|shadow)).jar; do
              cp -p "$jar" mods/
          done
          ls -l mods

      # This is the artifact recommended for users to download
      - name: Upload mods
        uses: actions/upload-artifact@v7
        with:
          name: mods
          path: mods/*.jar